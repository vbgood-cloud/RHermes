[package]
name = "rhermes"
version = "0.7.13"
edition = "2024"
description = "Reasonix 的省 Token 肌肉 + Hermes 的自进化大脑 + Rust 的零开销骨架"
authors = ["RHermes Contributors"]
license = "MIT"
repository = "https://github.com/rhermes/rhermes"

[lib]
name = "rhermes"
path = "src/lib.rs"

[[bin]]
name = "rhermes"
path = "src/main.rs"

[[bin]]
name = "rhermes-stu"
path = "src/bin/rhermes_stu.rs"

[[bin]]
name = "rhermes-teacher"
path = "src/bin/rhermes_teacher.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "local-time"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "socks", "multipart", "native-tls", "charset", "http2", "macos-system-configuration"] }
serde_json = "1"
unicode-width = "0.2"
time = { version = "0.3", features = ["macros"] }
futures-util = "0.3"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
dialoguer = "0.11"
rusqlite = { version = "0.32", features = ["bundled", "vtab"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
argon2 = "0.5"
rand = "0.8"
regex = "1"
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"
pdf-extract = "0.7"
walkdir = "2"

# Office 文档处理
calamine = "0.26"
rust_xlsxwriter = "0.82"
docx-rs = "0.4"
zip = "2"
quick-xml = "0.36"

scraper = "0.22"
lru = "0.12"
cron = "0.13"
extism = "1.5"
ureq = { version = "2", features = ["json"] }

ratatui = "0.29"
crossterm = "0.28"
qrcodegen = "1.8.0"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors"] }
iroh = "1.0"
# ── 去中心化教学通信（P2P 教学班）──
iroh-gossip = "0.101"   # 每教学班独立 Topic 的群组广播（依赖 iroh ^1）
iroh-blobs = "0.103"    # 作业文件：BLAKE3 内容寻址 + 多源下载（依赖 iroh ^1）
blake3 = "1"            # Topic 派生（KDF）与哈希字符串
hex = "0.4"             # TopicId / EndpointId 的 hex 编解码
bytes = "1"             # gossip / blobs 的字节载体
anyhow = "1"            # 新增网络层的错误聚合（既有模块仍沿用 String 错误）
postcard = { version = "1", features = ["alloc"] }  # gossip 消息紧凑序列化
liteparse = { version = "2.6", default-features = false }

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3"
