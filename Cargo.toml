[package]
name = "rhermes"
version = "0.7.37"
edition = "2024"
description = "Reasonix 閻ㄥ嫮娓?Token 閼插矁鍊?+ Hermes 閻ㄥ嫯鍤滄潻娑樺婢堆嗗壋 + Rust 閻ㄥ嫰娴傚鈧柨鈧銊︾仸"
authors = ["RHermes Contributors"]
license = "MIT"
repository = "https://github.com/rhermes/rhermes"

[lib]
name = "rhermes"
path = "src/lib.rs"

[[bin]]
name = "rhermes"
path = "src/main.rs"

[[bin]]
name = "rhermes-stu"
path = "src/bin/rhermes_stu.rs"

[[bin]]
name = "rhermes-teacher"
path = "src/bin/rhermes_teacher.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "local-time"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "socks", "multipart", "native-tls", "charset", "http2", "macos-system-configuration"] }
serde_json = "1"
unicode-width = "0.2"
time = { version = "0.3", features = ["macros"] }
futures-util = "0.3"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
dialoguer = "0.11"
rusqlite = { version = "0.32", features = ["bundled", "vtab"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
argon2 = "0.5"
rand = "0.8"
regex = "1"
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"
pdf-extract = "0.7"
walkdir = "2"

# Office 閺傚洦銆傛径鍕倞
calamine = "0.26"
rust_xlsxwriter = "0.82"
docx-rs = "0.4"
zip = "2"
quick-xml = "0.36"

scraper = "0.22"
lru = "0.12"
cron = "0.13"
extism = "1.5"
ureq = { version = "2", features = ["json"] }

ratatui = "0.29"
crossterm = "0.28"
qrcodegen = "1.8.0"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors"] }
iroh = "1.0"
# 閳光偓閳光偓 閸樿鑵戣箛鍐ㄥ閺佹瑥顒熼柅姘繆閿涘湧2P 閺佹瑥顒熼悵顓ㄧ礆閳光偓閳光偓
iroh-gossip = "0.101"   # 濮ｅ繑鏆€鐎涳妇褰悪顒傜彌 Topic 閻ㄥ嫮鍏㈢紒鍕畭閹绢叏绱欐笟婵婄 iroh ^1閿?
iroh-blobs = "0.103"    # 娴ｆ粈绗熼弬鍥︽閿涙LAKE3 閸愬懎顔愮€佃娼?+ 婢舵碍绨稉瀣祰閿涘牅绶风挧?iroh ^1閿?
blake3 = "1"            # Topic 濞插墽鏁撻敍鍦濪F閿涘绗岄崫鍫濈瑖鐎涙顑佹稉?
hex = "0.4"             # TopicId / EndpointId 閻?hex 缂傛牞袙閻?
bytes = "1"             # gossip / blobs 閻ㄥ嫬鐡ч懞鍌濇祰娴?
anyhow = "1"            # 閺傛澘顤冪純鎴犵捕鐏炲倻娈戦柨娆掝嚖閼辨艾鎮庨敍鍫熸＆閺堝膩閸фぞ绮涘▽璺ㄦ暏 String 闁挎瑨顕ら敍?
postcard = { version = "1", features = ["alloc"] }  # gossip 濞戝牊浼呯槐褍鍣炬惔蹇撳灙閸?
liteparse = { version = "2.6", default-features = false }

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3"
rustls = "0.23"
