[package]
name = "rhermes"
version = "0.7.22"
edition = "2024"
description = "Reasonix 鐨勭渷 Token 鑲岃倝 + Hermes 鐨勮嚜杩涘寲澶ц剳 + Rust 鐨勯浂寮€閿€楠ㄦ灦"
authors = ["RHermes Contributors"]
license = "MIT"
repository = "https://github.com/rhermes/rhermes"

[lib]
name = "rhermes"
path = "src/lib.rs"

[[bin]]
name = "rhermes"
path = "src/main.rs"

[[bin]]
name = "rhermes-stu"
path = "src/bin/rhermes_stu.rs"

[[bin]]
name = "rhermes-teacher"
path = "src/bin/rhermes_teacher.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "local-time"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "socks", "multipart", "native-tls", "charset", "http2", "macos-system-configuration"] }
serde_json = "1"
unicode-width = "0.2"
time = { version = "0.3", features = ["macros"] }
futures-util = "0.3"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
dialoguer = "0.11"
rusqlite = { version = "0.32", features = ["bundled", "vtab"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
argon2 = "0.5"
rand = "0.8"
regex = "1"
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"
pdf-extract = "0.7"
walkdir = "2"

# Office 鏂囨。澶勭悊
calamine = "0.26"
rust_xlsxwriter = "0.82"
docx-rs = "0.4"
zip = "2"
quick-xml = "0.36"

scraper = "0.22"
lru = "0.12"
cron = "0.13"
extism = "1.5"
ureq = { version = "2", features = ["json"] }

ratatui = "0.29"
crossterm = "0.28"
qrcodegen = "1.8.0"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors"] }
iroh = "1.0"
# 鈹€鈹€ 鍘讳腑蹇冨寲鏁欏閫氫俊锛圥2P 鏁欏鐝級鈹€鈹€
iroh-gossip = "0.101"   # 姣忔暀瀛︾彮鐙珛 Topic 鐨勭兢缁勫箍鎾紙渚濊禆 iroh ^1锛?
iroh-blobs = "0.103"    # 浣滀笟鏂囦欢锛欱LAKE3 鍐呭瀵诲潃 + 澶氭簮涓嬭浇锛堜緷璧?iroh ^1锛?
blake3 = "1"            # Topic 娲剧敓锛圞DF锛変笌鍝堝笇瀛楃涓?
hex = "0.4"             # TopicId / EndpointId 鐨?hex 缂栬В鐮?
bytes = "1"             # gossip / blobs 鐨勫瓧鑺傝浇浣?
anyhow = "1"            # 鏂板缃戠粶灞傜殑閿欒鑱氬悎锛堟棦鏈夋ā鍧椾粛娌跨敤 String 閿欒锛?
postcard = { version = "1", features = ["alloc"] }  # gossip 娑堟伅绱у噾搴忓垪鍖?
liteparse = { version = "2.6", default-features = false }

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3"
