[permissions]
allow = ["Edit", "Bash=cd /e/lab/RHermes && cargo build --release 2>&1 | tail -3", "Bash=cp /e/lab/RHermes/target/release/rhermes.exe /e/ai/new/ && echo \"拷贝完成\" && tasklist //FI \"IMAGENAME eq rhermes.exe\" 2>&1 | tail -2", "run_skill", "Bash=cp /e/lab/RHermes/target/release/rhermes.exe /e/ai/new/ 2>&1 && echo \"✅ 拷贝成功（无占用）\" || { echo \"文件被占用，终止进程后重试\"; taskkill //F //IM rhermes.exe 2>/dev/null; sleep 2; cp /e/lab/RHermes/target/release/rhermes.exe /e/ai/new/ && echo \"✅ 拷贝成功（已终止旧进程）\"; }", "Bash=echo \"=== 编译产物 ===\" && ls -la /e/lab/RHermes/target/release/{rhermes,rhermes-stu,rhermes-teacher}.exe | awk '{print $NF, $5, $6, $7, $8}' && echo \"\" && echo \"=== 部署目录 ===\" && ls -la /e/ai/new/rhermes.exe /e/ai/stu/rhermes-stu.exe /e/ai/teacher/rhermes-teacher.exe | awk '{print $NF, $5, $6, $7, $8}' && echo \"\" && echo \"=== 一致性校验 ===\" && for p in \"rhermes.exe /e/ai/new/rhermes.exe\" \"rhermes-stu.exe /e/ai/stu/rhermes-stu.exe\" \"rhermes-teacher.exe /e/ai/teacher/rhermes-teacher.exe\"; do set -- $p; a=$(md5sum /e/lab/RHermes/target/release/$1 | cut -d' ' -f1); b=$(md5sum $2 | cut -d' ' -f1); [ \"$a\" = \"$b\" ] && echo \"✅ $1 一致\" || echo \"❌ $1 不一致\"; done", "Bash=cp /e/lab/RHermes/target/release/rhermes-stu.exe /e/ai/stu/ 2>&1 && cp /e/lab/RHermes/target/release/rhermes-teacher.exe /e/ai/teacher/ 2>&1 && echo \"✅ 拷贝完成\" || { echo \"占用，杀进程重试\"; taskkill //F //IM rhermes-stu.exe 2>/dev/null; taskkill //F //IM rhermes-teacher.exe 2>/dev/null; sleep 2; cp /e/lab/RHermes/target/release/rhermes-stu.exe /e/ai/stu/ && cp /e/lab/RHermes/target/release/rhermes-teacher.exe /e/ai/teacher/ && echo \"✅ 拷贝完成（已终止旧进程）\"; }", "Bash=for p in \"rhermes.exe /e/ai/new/rhermes.exe\" \"rhermes-stu.exe /e/ai/stu/rhermes-stu.exe\" \"rhermes-teacher.exe /e/ai/teacher/rhermes-teacher.exe\"; do set -- $p; a=$(md5sum /e/lab/RHermes/target/release/$1 | cut -d' ' -f1); b=$(md5sum $2 | cut -d' ' -f1); [ \"$a\" = \"$b\" ] && echo \"✅ $1 → $2 一致\" || echo \"❌ $1 不一致\"; done"]
